[llm.qwen]
base_url = "http://192.168.1.19:1234/v1"
api_key = "sk-local"

[llm.openai]
base_url = "http://192.168.1.19:1234/v1"
api_key = "sk-local"

[llm.anthropic]
base_url = "http://192.168.1.19:1234/v1"
api_key = "sk-local"
thinking_budget = 10000

[behaviour]
language = "Russian"
repair_iterations = 4
max_passes = 3
max_tokens = 2048
repair_mode = "maximum"
system_role_providers = []

[infra]
streaming = true

[logging]
level = "debug"

[database]
path = "../db/game.db"

[world_loading]
path_ahead_depth = 2

[logger_levels]
aiosqlite = "WARNING"
"app.application.worldData.pack" = "DEBUG"
"app.consumer.pack_bake" = "DEBUG"
"app.consumer.pack_refine_grade" = "DEBUG"
"app.application.worldData.materialize.terrainParallelLog" = "DEBUG"

[planning.cache]
max_retained_bytes = 67108864
max_entry_bytes = 8388608
eviction = "lru"

[planning.execution]
max_workers = 2
max_pending_builds = 16